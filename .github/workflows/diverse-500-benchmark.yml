name: Diverse 500 All-Module and Fresh-Source Benchmark
on:
  pull_request:
    branches: [main]
    paths:
      - scripts/sample_diverse_500_companies.py
      - .github/workflows/diverse-500-benchmark.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diverse:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frozen dependencies
        run: uv sync --frozen
      - name: Select 500 exact company identities spread across 100 public pages
        run: uv run python scripts/sample_diverse_500_companies.py
      - name: Run all ten research modules for 500 diverse organisations
        run: |
          uv run python scripts/run_competition_batch.py \
            --organisations artifacts/diverse-500/input-500.json \
            --output artifacts/diverse-500/terminal-500.jsonl \
            --profiles-output artifacts/diverse-500/profiles-500.jsonl \
            --report artifacts/diverse-500/run-report-500.json \
            --run-id signalpost-diverse-500-${{ github.run_id }} \
            --expected-count 500 \
            --workers 12 \
            --checkpoint-every 25
      - name: Audit provenance and all module states
        run: |
          uv run python scripts/audit_full_500_modules.py \
            --profiles artifacts/diverse-500/profiles-500.jsonl \
            --report artifacts/diverse-500/run-report-500.json \
            --output artifacts/diverse-500/full-module-audit.json
      - name: Verify claims with fresh external sources
        run: |
          uv run python scripts/verify_all_claims_live.py \
            --profiles artifacts/diverse-500/profiles-500.jsonl \
            --output artifacts/diverse-500/live-source-claim-audit.json \
            --workers 8
      - name: Enforce independent source-confirmation threshold
        run: |
          uv run python -c "import json; p=json.load(open('artifacts/diverse-500/live-source-claim-audit.json')); assert p['confirmation_rate_over_all_claims']>=0.95, 'Source-confirmation rate fell below 95%'; print('PASS',p['confirmation_rate_over_all_claims'])"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diverse-500-company-source-backed-audit
          path: artifacts/diverse-500/
          retention-days: 30
