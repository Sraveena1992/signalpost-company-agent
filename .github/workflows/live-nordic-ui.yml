name: Live Nordic Landing UI
on:
  pull_request:
    branches: [main]
    paths:
      - scripts/check_live_nordic_contrast.py
      - .github/workflows/live-nordic-ui.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Chromium browser tool
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Validate deployed desktop/mobile UX
        run: python scripts/check_live_nordic_contrast.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-nordic-ui-proof
          path: artifacts/live-nordic-ui/
