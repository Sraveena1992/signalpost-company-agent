name: Reverify latest 500 claims against freshly fetched original sources
on:
  push:
    branches: [audit/live-reviewer-proof-20261114]
    paths:
      - .github/workflows/recheck-latest-500-claims.yml
      - scripts/verify_all_claims_live.py
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  independent-source-recheck:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download exact completed latest 500-company pipeline outputs
        run: |
          mkdir -p artifacts/latest-audit
          gh run download 43601907908 --repo "${{ github.repository }}" --name full-500-ten-module-audit --dir artifacts/latest-audit
          test -s artifacts/latest-audit/profiles-500.jsonl
      - name: Re-fetch original source URLs and compare values by claim category
        run: |
          python scripts/verify_all_claims_live.py \
            --profiles artifacts/latest-audit/profiles-500.jsonl \
            --output artifacts/latest-audit/fresh-source-validation.json \
            --workers 8
      - name: Assert source-level audit coverage was recorded
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('artifacts/latest-audit/fresh-source-validation.json').read_text())
          assert data['companies']==500
          assert data['claims_total']==7673
          assert sum(data['claim_status'].values())==7673
          print('Claim audit completed. This is NOT official Builderr gold-label accuracy.')
          print(json.dumps({key:data[key] for key in ('companies','claims_total','claim_status','confirmation_rate_over_all_claims','confirmed_fraction_among_decidable')},indent=2))
          PY
      - name: Upload latest 500 fresh-source audit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: latest-500-independent-source-recheck
          path: artifacts/latest-audit/fresh-source-validation.json
          retention-days: 14
          if-no-files-found: warn
