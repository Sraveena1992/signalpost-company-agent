name: Refresh soupsieve security lock (one-time revision)
on:
  push:
    branches: [fix/evaluator-identity-news-jobs-20261113]
    paths: [.github/workflows/refresh-soupsieve-lock.yml]
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Upgrade patched soupsieve and regenerate the pinned lock
        run: |
          uv lock --upgrade-package soupsieve
          uv sync --frozen
          uv tree --frozen | grep soupsieve
          uv run --with pip-audit pip-audit -r <(uv export --frozen --no-dev --no-hashes --format requirements-txt) 
        shell: bash
      - name: Commit updated lock on experimental branch
        run: |
          if ! git diff --quiet -- uv.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add uv.lock
            git commit -m "fix: upgrade vulnerable locked soupsieve dependency"
            git push origin HEAD:fix/evaluator-identity-news-jobs-20261113
          fi
