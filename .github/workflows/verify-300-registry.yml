name: Verify 300 Official Company Records
on:
  push:
    branches: [fix/final-directory-300-evidence-audit-20261113]
    paths:
      - scripts/verify_registry_directory.py
      - .github/workflows/verify-300-registry.yml
  pull_request:
    branches: [main]
    paths:
      - scripts/verify_registry_directory.py
      - .github/workflows/verify-300-registry.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify 300 company identities against exact official records
        run: |
          python scripts/verify_registry_directory.py --count 300 --workers 4 --output artifacts/verified-directory-300.json --report artifacts/verified-directory-report.json
      - name: Upload official record audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: official-300-company-directory-audit
          path: |
            artifacts/verified-directory-300.json
            artifacts/verified-directory-report.json
